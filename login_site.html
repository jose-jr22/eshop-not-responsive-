<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN FORM TO ACC</title>
    <link rel="stylesheet" href="login_site.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- LOGIN VIEW -->
    <section>
        <div class="modal-container">
            <h3>Login</h3>
            <div class="login-form">

                <input type="text" name="user-login" id="user-login" placeholder="Username">
                <input type="password" name="pass-login" id="pass-login" placeholder="Password">
                <input type="submit" onclick="Login()" name="btn-login" id="btn-login" value="Login">
                <input type="submit" onclick="back()" name="btn-login" id="btn-login" value="Back">

            </div>

            <script src="login_to_admin.js">
            </script>

        </div>
    </section>
    
</body>
</html>
